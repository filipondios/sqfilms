<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%"> 
  <!-- Icono de línea blanco más grande (Claqueta de cine) -->
  <!-- Se ha aplicado una escala de 1.5 y ajustado la posición -->
  <g transform="translate(90, 145) scale(1.5)" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cuerpo inferior de la claqueta -->
    <rect x="0" y="20" width="80" height="55" rx="6" />
    
    <!-- Línea de separación -->
    <path d="M 0 20 L 80 20" />
    
    <!-- Barra superior de la claqueta -->
    <path d="M 0 6 L 80 6 L 80 20 L 0 20 Z" />
    
    <!-- Franjas diagonales clásicas -->
    <path d="M 16 6 L 26 20" />
    <path d="M 40 6 L 50 20" />
    <path d="M 64 6 L 74 20" />
    
    <!-- Líneas sutiles que simulan texto/guión -->
    <path d="M 16 40 L 40 40" stroke-width="2" opacity="0.3" />
    <path d="M 16 54 L 64 54" stroke-width="2" opacity="0.3" />
  </g>
  
  <!-- Texto descriptivo inferior (ligeramente ajustado hacia abajo) -->
  <text x="150" y="310" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="1.5">
    NO POSTER
  </text>
</svg>
